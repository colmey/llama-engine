# Portable inference backend: llama.cpp (CUDA sm_120) + llama-swap.
# Build:  docker compose build
# Run:    docker compose up -d
# Needs:  NVIDIA driver + NVIDIA Container Toolkit on the host (see README.md).
#
# Requires a .env file in this directory (see .env.example). At minimum LLM_API_KEY;
# optional MODELS_DIR (GGUF dir, default ./models) and LLM_HOST_PORT (exposed port, default 8081).
#   echo "LLM_API_KEY=$(cat .api-key)" > .env

services:
  llm:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        CUDA_ARCH: "120"          # Blackwell (sm_120); use "89;120" to also run on Ada GPUs
    image: llm-inference:latest
    container_name: llm-inference
    restart: unless-stopped
    env_file: .env                # provides LLM_API_KEY (entrypoint injects it into the config)
    ports:
      - "0.0.0.0:${LLM_HOST_PORT:-8081}:8080"   # LAN-accessible: all devices on the network can reach it
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro   # GGUF dir; override per-box via MODELS_DIR in .env (this box: /mnt/Data/models)
      - ./docker/llama-swap.yaml:/config/llama-swap.yaml:ro
    gpus: all                     # requires NVIDIA Container Toolkit
    # Older Compose without `gpus:` — use this instead:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
