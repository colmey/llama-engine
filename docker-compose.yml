# Portable inference backend: llama.cpp (CUDA sm_120) + llama-swap.
# Build:  docker compose build
# Run:    docker compose up -d
# Needs:  NVIDIA driver + NVIDIA Container Toolkit on the host (see README.md).
#
# Requires a .env file in this directory (see .env.example). At minimum LLM_API_KEY;
# optional MODELS_DIR (GGUF dir, default ./models) and LLM_HOST_PORT (exposed port, default 8081).
#   echo "LLM_API_KEY=$(cat .api-key)" > .env

services:
  llm:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        CUDA_ARCH: "120"          # Blackwell (sm_120); use "89;120" to also run on Ada GPUs
    image: llm-inference:latest
    container_name: llm-inference
    restart: unless-stopped
    env_file: .env                # provides LLM_API_KEY (entrypoint injects it into the config)
    ports:
      - "0.0.0.0:${LLM_HOST_PORT:-8081}:8080"   # LAN-accessible: all devices on the network can reach it
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro   # GGUF dir; override per-box via MODELS_DIR in .env (this box: /mnt/Data/models)
      - ./docker/llama-swap.yaml:/config/llama-swap.yaml:ro
      - ./scripts/vram-guard.sh:/usr/local/bin/vram-guard.sh:ro   # VRAM-pressure auto-evict sidecar
    # Start the VRAM guard in the background, then hand off to the real entrypoint (which
    # injects the API key and execs llama-swap). The guard unloads the model when free VRAM
    # drops, so gaming/media can reclaim the GPU — see scripts/vram-guard.sh. Bind-mounted +
    # overridden here so it works without rebuilding; fold into docker/entrypoint.sh on a rebuild.
    entrypoint: ["/bin/sh", "-c", "sh /usr/local/bin/vram-guard.sh & exec /usr/local/bin/entrypoint.sh"]
    environment:
      VRAM_GUARD_FLOOR_MB: "700"   # evict the model below this much free VRAM (MiB). More cushion:
                                   # raise --n-cpu-moe in llama-swap.yaml. Disable: VRAM_GUARD_DISABLE=1
    # GPU via CDI (Container Device Interface) — NOT `gpus: all` / the legacy
    # `driver: nvidia` hook. The legacy path injects the GPU device-cgroup rules
    # out-of-band, so a `systemctl daemon-reload` (the daily apt-daily timer fires
    # one) makes systemd re-apply its DeviceAllow list and strip the container's GPU
    # access. The container keeps running but loses the GPU, and the next llama-swap
    # model reload silently falls back to CPU/RAM. CDI registers the GPUs as
    # first-class OCI devices that systemd is aware of, so they survive a reload.
    # Requires a persisted CDI spec (regenerate after each NVIDIA driver upgrade):
    #   sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              device_ids:
                - nvidia.com/gpu=all
              capabilities: [gpu]   # required by the compose schema even for CDI
